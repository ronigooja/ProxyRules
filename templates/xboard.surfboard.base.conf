#!MANAGED-CONFIG $subs_link interval=43200 strict=true

[General]
loglevel = notify
ipv6 = true
doh-server = https://1.12.12.12/dns-query, https://120.53.53.53/dns-query
proxy-test-url = https://cp.cloudflare.com/generate_204

[Panel]
SubscribeInfo = $subscribe_info, style=info

[Proxy]
$proxies

[Proxy Group]
{{PROXY_GROUPS}}

[Host]
doh.pub = 1.12.12.12

[Rule]
DOMAIN,$subs_domain,DIRECT
