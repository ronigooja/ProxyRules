mixed-port: 17890
allow-lan: true
bind-address: "*"
mode: rule
log-level: warning
external-controller: 127.0.0.1:9090
unified-delay: true
tcp-concurrent: true

dns:
  enable: true
  ipv6: true
  respect-rules: true
  default-nameserver:
    - https://223.5.5.5/dns-query#DIRECT
  proxy-server-nameserver:
    - https://223.5.5.5/dns-query#DIRECT
  direct-nameserver:
    - https://223.5.5.5/dns-query#DIRECT
  direct-nameserver-follow-policy: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  use-hosts: true
  nameserver-policy:
{{DNS_POLICIES}}
  nameserver:
    - "https://1.1.1.1/dns-query#🐟 其他流量"
    - "https://8.8.8.8/dns-query#🐟 其他流量"
  fake-ip-filter:
    - "*.lan"
    - "*.local"
    - "*.localhost"
    - "*.test"
    - localhost.ptlogin2.qq.com
    - "+.stun.*.*"
    - "+.stun.*.*.*"
    - "+.stun.*.*.*.*"
    - "lens.l.google.com"
    - "*.srv.nintendo.net"
    - "+.stun.playstation.net"
    - "xbox.*.*.microsoft.com"
    - "*.*.xboxlive.com"
    - "+.msftncsi.com"
    - "+.msftconnecttest.com"

rule-providers:
{{DNS_RULE_PROVIDERS}}

proxies:

proxy-groups:
{{PROXY_GROUPS}}

rules:
